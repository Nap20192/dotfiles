# vim:ft=kitty
## name: vnkjd dark
## author: vnkjd
## blurb: Dark kitty theme with vnkjd colors


# The basic colors
foreground #f4efe6
background #080706
selection_foreground #18130d
selection_background #ff9900

# Cursor colors
cursor #ff9900
cursor_text_color #18130d

# Scrollbar colors
scrollbar_handle_color #8a7b67
scrollbar_track_color #18140e

# URL color when hovering with mouse
url_color #ff9900

# Kitty window border colors
active_border_color #ff9900
inactive_border_color #8a7b67
bell_border_color #f28a78

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground #18130d
active_tab_background #ff9900
inactive_tab_foreground #f4efe6
inactive_tab_background #18140e
tab_bar_background #080706

# Colors for marks (marked text in the terminal)
