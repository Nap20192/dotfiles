# Palette mirrored from ~/.tmux.conf
# bg     "#191919"
# fg     "#dadada"
# accent "#ffaf00"

[app]
overall = { bg = "#191919" }

[mgr]
cwd = { fg = "#dadada", bold = true }

# Find
find_keyword = { fg = "#ffaf00", bg = "#3a2b00", bold = true }
find_position = { fg = "#ffaf00", bold = true, italic = true }

# Marker
marker_copied = { fg = "#7fbf7f", bg = "#7fbf7f" }
marker_cut = { fg = "#ff5f5f", bg = "#ff5f5f" }
marker_marked = { fg = "#ffaf00", bg = "#ffaf00" }
marker_selected = { fg = "#ffaf00", bg = "#ffaf00" }

# Count
count_copied = { fg = "#7fbf7f", bold = true, reversed = true }
count_cut = { fg = "#ff5f5f", bold = true, reversed = true }
count_selected = { fg = "#ffaf00", bold = true, reversed = true }

# Border
border_symbol = "│"
border_style = { fg = "#303030" }

[indicator]
parent = { underline = true }
current = { fg = "#191919", bg = "#ffaf00", bold = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#191919", bg = "#ffaf00", bold = true }
inactive = { fg = "#a8a8a8", bg = "#242424" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#191919", bg = "#ffaf00", bold = true }
normal_alt = { fg = "#dadada", bg = "#242424" }

select_main = { fg = "#191919", bg = "#ffaf00", bold = true }
select_alt = { fg = "#ffaf00", bg = "#3a2b00" }

unset_main = { fg = "#191919", bg = "#ffaf00", bold = true }
unset_alt = { fg = "#ffaf00", bg = "#3a2b00" }

[status]
overall = { fg = "#dadada", bg = "#191919" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type = { fg = "#ffaf00" }
perm_read = { fg = "#dadada" }
perm_write = { fg = "#ff5f5f" }
perm_exec = { fg = "#7fbf7f" }
perm_sep = { fg = "#6f6f6f" }

# Progress
progress_label = { fg = "#191919", bold = true }
progress_normal = { fg = "#ffaf00", bg = "#3a2b00" }
progress_error = { bg = "#ff5f5f" }

[which]
cols = 3
mask = { bg = "#242424" }
cand = { fg = "#ffaf00", bold = true }
rest = { fg = "#ffaf00", italic = true }
desc = { fg = "#8a8a8a" }
separator = " "
separator_style = { }

[confirm]
border = { fg = "#303030" }
title = { fg = "#ffaf00", bold = true }
body = { fg = "#dadada", bold = true }
list = { fg = "#dadada" }
btn_yes = { fg = "#191919", bg = "#ffaf00", bold = true }
btn_no = { fg = "#a8a8a8", bg = "#242424" }

[spot]
border = { fg = "#303030" }
title = { fg = "#ffaf00", bold = true }
tbl_col = { fg = "#a8a8a8" }
tbl_cell = { fg = "#dadada", bg = "#242424" }

[notify]
title_info = { fg = "#ffaf00" }
title_warn = { fg = "#ffaf00" }
title_error = { fg = "#ff5f5f" }

[pick]
border = { fg = "#303030", bold = true }
active = { fg = "#ffaf00", bold = true }
inactive = { fg = "#a8a8a8" }

[input]
border = { fg = "#303030" }
title = { fg = "#ffaf00", bold = true }
value = { fg = "#dadada" }
selected = { fg = "#191919", bg = "#ffaf00" }

[cmp]
border = { fg = "#303030", bold = true }
active = { fg = "#191919", bg = "#ffaf00", bold = true }
inactive = { fg = "#a8a8a8" }

[tasks]
border = { fg = "#303030" }
title = { fg = "#ffaf00", bold = true }
hovered = { fg = "#191919", bg = "#ffaf00", bold = true }

[help]
on = { fg = "#ffaf00" }
run = { fg = "#dadada" }
desc = { fg = "#8a8a8a", italic = true }
hovered = { fg = "#191919", bg = "#ffaf00" }
footer = { fg = "#191919", bg = "#ffaf00", bold = true }

[filetype]
rules = [
  { mime = "inode/empty", fg = "#6f6f6f" },

  { url = "*", is = "orphan", fg = "#6f6f6f" },
  { url = "*/", is = "orphan", fg = "#6f6f6f" },
  { url = "*", is = "link", fg = "#ffaf00" },
  { url = "*/", is = "link", fg = "#ffaf00" },
  { url = "*", is = "block", fg = "#dadada" },
  { url = "*", is = "char", fg = "#dadada" },
  { url = "*", is = "fifo", fg = "#ffaf00" },
  { url = "*", is = "sock", fg = "#ffaf00" },
  { url = "*", is = "sticky", fg = "#dadada" },
  { url = "*", is = "dummy", fg = "#6f6f6f" },

  { url = "*/", fg = "#ffaf00" },
  { url = "*", is = "exec", fg = "#7fbf7f" },
  { url = "*", fg = "#dadada" }
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#ffaf00" },
  { name = ".git", text = "", fg = "#ffaf00" },
  { name = ".github", text = "", fg = "#ffaf00" },
  { name = ".npm", text = "", fg = "#ffaf00" },
  { name = "Desktop", text = "", fg = "#ffaf00" },
  { name = "Development", text = "", fg = "#ffaf00" },
  { name = "Documents", text = "", fg = "#ffaf00" },
  { name = "Downloads", text = "", fg = "#ffaf00" },
  { name = "Library", text = "", fg = "#ffaf00" },
  { name = "Movies", text = "", fg = "#ffaf00" },
  { name = "Music", text = "", fg = "#ffaf00" },
  { name = "Pictures", text = "", fg = "#ffaf00" },
  { name = "Public", text = "", fg = "#ffaf00" },
  { name = "Videos", text = "", fg = "#ffaf00" }
]
conds = [
  { if = "orphan", text = "", fg = "#6f6f6f" },
  { if = "link", text = "", fg = "#ffaf00" },
  { if = "block", text = "", fg = "#dadada" },
  { if = "char", text = "", fg = "#dadada" },
  { if = "fifo", text = "", fg = "#ffaf00" },
  { if = "sock", text = "", fg = "#ffaf00" },
  { if = "sticky", text = "", fg = "#dadada" },
  { if = "dummy", text = "", fg = "#6f6f6f" },

  { if = "dir", text = "", fg = "#ffaf00" },
  { if = "exec", text = "", fg = "#7fbf7f" },
  { if = "!dir", text = "", fg = "#dadada" }
]
