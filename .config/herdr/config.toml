onboarding = false
# herdr — https://herdr.dev/docs/configuration/

[theme]
# reviewr's config mirrors this name (its themes resolve the same palettes)
name = "gruvbox-light"
auto_switch = false
[ui]
# tmux parity: status/tab strip at the bottom
tab_bar_position = "bottom"

agent_panel_sort = "spaces"
[keys]
# alt is herdr's layer (see ~/Notes/hotkeys-audit.md); tmux keeps ctrl+space
# for SSH boxes where herdr is absent.
prefix = "alt+space"

# alt layer: alt+p/n switch tabs (alt+j/k now belong to pane nav below)
previous_tab = ["prefix+p", "alt+p"]
next_tab = ["prefix+n", "alt+n"]

# tmux parity: `prefix d` detaches (q kept too)
detach = ["prefix+q", "prefix+d"]

# tmux parity: `prefix g` opens a scratch popup shell; herdr's goto moves to u
goto = "prefix+u"

# worktrees: w = create worktree + workspace, W = open existing, ctrl+w = remove
new_worktree = "prefix+w"
open_worktree = "prefix+shift+w"
remove_worktree = "prefix+ctrl+w"

# prefix-less Alt+hjkl live below as vim-nav plugin actions: nvim panes get
# the key passed through (vim splits work), other panes move herdr focus.
# Bare ctrl+hjkl now reach apps again (ctrl+l clear-screen is back).
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vnkjd.vim-nav.left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "vnkjd.vim-nav.down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "vnkjd.vim-nav.up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vnkjd.vim-nav.right"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "zsh"
width = "80%"
height = "80%"

[[keys.command]]
# ctrl+alt+r: free on every layer (niri owns Super+R/Shift/Ctrl variants,
# tmux is prefix-only, ghostty uses ctrl+shift), reaches herdr directly
key = "ctrl+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[ui.sound]
# freedesktop theme sounds (same as DMS) pre-attenuated to 10% volume —
# herdr has no volume knob, so the files themselves are quiet
path = "sounds/notification.mp3"
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

[experimental]
kitty_graphics = true
