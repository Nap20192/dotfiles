id = "vnkjd.vim-nav"
name = "Vim Nav"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "vim-aware ctrl+hjkl: nvim gets the key, otherwise herdr moves pane focus"
platforms = ["linux", "macos"]

[[actions]]
id = "left"
title = "Focus left (vim-aware)"
command = ["bash", "nav.sh", "left"]

[[actions]]
id = "down"
title = "Focus down (vim-aware)"
command = ["bash", "nav.sh", "down"]

[[actions]]
id = "up"
title = "Focus up (vim-aware)"
command = ["bash", "nav.sh", "up"]

[[actions]]
id = "right"
title = "Focus right (vim-aware)"
command = ["bash", "nav.sh", "right"]
