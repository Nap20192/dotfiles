set -g mouse on

set-window-option -g mode-keys vi

# Keep tmux copy-mode, terminal OSC 52, and the Wayland clipboard in sync.
set -g set-clipboard on
set -as terminal-features ',wezterm:clipboard:RGB'
set -as terminal-features ',xterm-256color:clipboard:RGB'

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Fuzzy find windows across ALL sessions and switch to the selected one
bind-key C-f split-window -v -l 30 'tmux list-windows -a -F "#S:#I: #W" | fzf --height 30 --reverse --preview "tmux capture-pane -p -t \$(echo {} | awk -F: '\''{print \$1\":\"\$2}'\'')" --preview-window right:50% | awk -F: "{print \$1\":\"\$2}" | xargs -I{} tmux switch-client -t {}; tmux kill-pane -t $TMUX_PANE'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel 'wl-copy'

# makes tmux numbering start from 1
set -g base-index 1 
setw -g pane-base-index 1 

# colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -g status-style bg='#191919',fg='#dadada'
set-window-option -g window-status-current-style bg='#ffaf00',fg='#191919'

# new panes are open in pwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-strategy-nvim 'session'

# initialize TMUX plugin manager 
# (keep this line at the very bottom of tmux.conf)
# prefix + I (capital i, as in Install) to fetch the plugin.
run '~/.tmux/plugins/tpm/tpm'

set -g status-left-length 50
set -g status-right-length 120
set -g status-right '#(${ILYASYOY_DOTFILES_DIR:-$HOME/Projects/IlyasYOY/dotfiles}/bin/tmux-keyboard-layout) | #(pmset -g batt | grep "InternalBattery" | awk "{print \$3}" | sed "s/;//") | #($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load -g 0 -t 0 -a 0 --interval 2) | %Y-%m-%d %a %H:%M'
